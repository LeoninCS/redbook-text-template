name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p _site/src
          cp index.html _site/
          cp -R src/. _site/src/
          touch _site/.nojekyll

      - name: Publish gh-pages branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages || true
          if git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            git worktree add _pages origin/gh-pages
          else
            git worktree add --detach _pages
            git -C _pages checkout --orphan gh-pages
          fi
          find _pages -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -R _site/. _pages/
          git -C _pages add -A
          git -C _pages commit -m "deploy: update github pages" || exit 0
          git -C _pages push origin HEAD:gh-pages
