<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>小红书文本模板排版工具</title>
    <link rel="stylesheet" href="src/styles.css">
  </head>
  <body>
    <main class="app-shell">
      <nav class="site-nav" aria-label="站点信息">
        <a class="brand-lockup" href="#library-title" aria-label="Redbook Text Template">
          <span class="brand-mark">RT</span>
          <span>Redbook Text Template</span>
        </a>
        <a class="author-link" href="https://github.com/LeoninCS/redbook-text-template" target="_blank" rel="noreferrer" aria-label="布洛克琴 GitHub">
          <span>布洛克琴</span>
          <svg class="github-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
            <path d="M12 .5C5.65.5.9 5.25.9 11.7c0 5 3.2 9.25 7.65 10.6.55.1.75-.25.75-.55v-2.1c-3.1.7-3.75-1.35-3.75-1.35-.5-1.3-1.2-1.65-1.2-1.65-1-.7.1-.7.1-.7 1.1.1 1.65 1.15 1.65 1.15 1 .1 1.55 1.45 3.15 1.05.1-.7.4-1.2.7-1.5-2.5-.3-5.1-1.25-5.1-5.55 0-1.25.45-2.25 1.15-3.05-.1-.3-.5-1.55.1-3.15 0 0 .95-.3 3.1 1.15.9-.25 1.85-.4 2.8-.4s1.9.15 2.8.4c2.15-1.45 3.1-1.15 3.1-1.15.6 1.6.2 2.85.1 3.15.7.8 1.15 1.8 1.15 3.05 0 4.3-2.6 5.25-5.1 5.55.4.35.75 1.05.75 2.1v3.1c0 .3.2.65.75.55 4.45-1.5 7.65-5.7 7.65-10.75C23.1 5.25 18.35.5 12 .5Z" />
          </svg>
        </a>
      </nav>

      <section class="library-view" id="libraryView" aria-labelledby="library-title">
        <header class="hero">
          <div>
            <h1 id="library-title">小红书文字模板库</h1>
          </div>
        </header>

        <section class="drafts-section" aria-labelledby="drafts-title">
          <div class="section-head">
            <div>
              <h2 id="drafts-title">最近草稿</h2>
            </div>
            <button class="secondary-button small-button" id="newDraftFromLibraryBtn" type="button">新建</button>
          </div>
          <div class="drafts-strip" id="draftsStrip" aria-label="最近草稿"></div>
        </section>

        <section class="works-section" aria-labelledby="works-title">
          <div class="section-head">
            <div>
              <h2 id="works-title">作品库</h2>
            </div>
          </div>
          <div class="works-grid" id="worksGrid" aria-label="作品库"></div>
        </section>

        <div class="library-layout">
          <aside class="library-sidebar">
            <nav class="category-filter" id="categoryFilter" aria-label="模板分类"></nav>
          </aside>
          <section class="template-grid" id="templateGrid" aria-label="模板库"></section>
        </div>
      </section>

      <section class="editor-view" id="editorView" hidden aria-labelledby="editor-title">
        <header class="editor-topbar">
          <button class="secondary-button" id="backBtn" type="button">返回</button>
          <div>
            <h2 id="editor-title">编辑</h2>
          </div>
        </header>

        <div class="editor-grid">
          <aside class="input-panel">
            <details class="editor-section" open>
              <summary>内容</summary>
              <div class="editor-section-body">
                <div class="draft-action-bar" aria-label="草稿操作">
                  <button class="secondary-button small-button" id="newDraftBtn" type="button">新建</button>
                  <button class="secondary-button small-button" id="duplicateDraftBtn" type="button">复制</button>
                  <button class="secondary-button small-button" id="renameDraftBtn" type="button">重命名</button>
                  <button class="secondary-button small-button" id="saveWorkBtn" type="button">保存作品</button>
                  <button class="secondary-button small-button" id="deleteDraftBtn" type="button">删除</button>
                </div>

                <div class="field">
                  <label for="templateSelect">当前模板</label>
                  <select id="templateSelect" name="templateSelect"></select>
                </div>

                <div class="field">
                  <label for="titleInput">标题</label>
                  <input id="titleInput" type="text" maxlength="42" placeholder="把普通文字排得更好看">
                </div>

                <div class="field">
                  <label for="bodyInput">正文</label>
                  <textarea id="bodyInput" rows="12" placeholder="支持 Markdown：## 标题、- 列表、> 引用、**重点**、`代码`"></textarea>
                </div>

                <div class="field">
                  <label for="signatureInput">署名</label>
                  <input id="signatureInput" type="text" maxlength="24" placeholder="小红书文本模板">
                </div>
              </div>
            </details>

            <details class="editor-section" open>
              <summary>样式</summary>
              <div class="editor-section-body">
                <section class="control-panel" aria-label="模板微调">
                  <div class="control-grid">
                    <label class="range-field" for="fontScaleInput">
                      <span>字号</span>
                      <input id="fontScaleInput" type="range" min="0.82" max="1.28" step="0.01">
                    </label>
                    <label class="range-field" for="lineHeightScaleInput">
                      <span>行距</span>
                      <input id="lineHeightScaleInput" type="range" min="0.86" max="1.28" step="0.01">
                    </label>
                    <label class="range-field" for="paddingScaleInput">
                      <span>边距</span>
                      <input id="paddingScaleInput" type="range" min="0.76" max="1.16" step="0.01">
                    </label>
                    <label class="range-field" for="surfaceAlphaInput">
                      <span>背景</span>
                      <input id="surfaceAlphaInput" type="range" min="0.16" max="1" step="0.01">
                    </label>
                    <label class="color-field" for="accentColorInput">
                      <span>主色</span>
                      <input id="accentColorInput" type="color">
                    </label>
                    <label class="select-field" for="alignSelect">
                      <span>对齐</span>
                      <select id="alignSelect" name="alignSelect">
                        <option value="left">左对齐</option>
                        <option value="center">居中</option>
                      </select>
                    </label>
                    <label class="select-field" for="toneModeSelect">
                      <span>明暗</span>
                      <select id="toneModeSelect" name="toneModeSelect">
                        <option value="auto">跟随模板</option>
                        <option value="light">浅色</option>
                        <option value="dark">深色</option>
                      </select>
                    </label>
                  </div>
                </section>
              </div>
            </details>

            <details class="editor-section">
              <summary>AI 辅助</summary>
              <div class="editor-section-body">
                <section class="ai-panel" aria-label="AI 辅助">
                  <div class="ai-panel-head">
                    <span>本地建议</span>
                    <button class="secondary-button small-button" id="aiSuggestBtn" type="button">生成建议</button>
                  </div>
                  <div class="ai-output" id="aiOutput">
                    <p>根据正文推荐模板、标题和小节。</p>
                  </div>
                </section>
              </div>
            </details>

            <details class="editor-section" open>
              <summary>导出</summary>
              <div class="editor-section-body export-section">
                <div class="export-summary" id="exportSummary" aria-live="polite"></div>
                <label class="compact-field" for="pageRangeInput">
                  <span>页码</span>
                  <input id="pageRangeInput" type="text" inputmode="numeric" placeholder="全部或 1-3,5">
                </label>
                <label class="compact-field" for="exportScaleSelect">
                  <span>倍率</span>
                  <select id="exportScaleSelect" name="exportScaleSelect">
                    <option value="1">1x</option>
                    <option value="2" selected>2x</option>
                    <option value="3">3x</option>
                  </select>
                </label>
                <button class="secondary-button" id="exportPngBtn" type="button">PNG ZIP</button>
                <button class="primary-button" id="exportPdfBtn" type="button">导出 PDF</button>
              </div>
            </details>

            <p class="status" id="statusText" role="status"></p>
          </aside>

          <section class="preview-panel" aria-label="手机预览">
            <div class="preview-pages" id="previewPages"></div>
          </section>
        </div>
      </section>
    </main>

    <script type="module" src="src/app.js"></script>
  </body>
</html>
